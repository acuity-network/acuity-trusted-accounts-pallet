[package]
name = "pallet-acuity-trusted-accounts-rpc-runtime-api"
version = "0.1.0"
description = "RPC runtime API for trusted accounts FRAME pallet"
authors = ["Jonathan Brown <jbrown@acuity.social>"]
homepage = "https://acuity.social/"
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/acuity-social/acuity-trusted-accounts-pallet"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false }
polkadot-sdk = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2512-3", default-features = false }

[features]
default = ["std"]
std = [
	"codec/std",
	"polkadot-sdk/sp-api",
	"polkadot-sdk/sp-std",
	"polkadot-sdk/std",
]
